[workspace]
resolver = "2"
members = ["crates/vflt-core", "crates/vflt-runner", "crates/vflt"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/primordiallabs/vflt"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde", "clock"] }
ulid = "1"
humantime = "2"
is-terminal = "0.4"
which = "7"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
shlex = "1"
whoami = "1"
dirs = "6"
